# MongoDB 8.0: bitácora de reservas y ficha flexible de cancha.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
data:
  01-usuarios.js: |
    // Corre SOLO la primera vez. Cuentas de servicio sin rol administrativo.
    const app = db.getSiblingDB("canchas");
    app.createUser({
      user: "canchas_app",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "canchas" }],
    });
    const admin = db.getSiblingDB("admin");
    admin.createUser({
      user: "canchas_monitor",
      pwd: process.env.MONGO_MONITOR_PASSWORD,
      roles: [{ role: "clusterMonitor", db: "admin" }],
    });
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-hl
  labels: {app: mongo}
spec:
  clusterIP: None
  selector: {app: mongo}
  ports:
    - {name: mongo, port: 27017}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {app: mongo}
spec:
  type: ClusterIP
  selector: {app: mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo-hl
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo, tier: datos}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-secret, key: MONGO_ROOT_PASSWORD}}
            - name: MONGO_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-secret, key: MONGO_APP_PASSWORD}}
            - name: MONGO_MONITOR_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-secret, key: MONGO_MONITOR_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: config, mountPath: /data/configdb}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: config
          emptyDir: {}
        - name: init
          configMap:
            name: mongo-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
