# PostgreSQL 16: StatefulSet con volumen persistente, cuentas con mínimo privilegio.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-roles.sh: |
    #!/bin/bash
    # Corre SOLO la primera vez (con el directorio de datos vacío).
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
      CREATE ROLE canchas_migrador LOGIN PASSWORD '${MIGRADOR_PASSWORD}';
      CREATE ROLE canchas_app      LOGIN PASSWORD '${APP_PASSWORD}';
      CREATE ROLE canchas_monitor  LOGIN PASSWORD '${MONITOR_PASSWORD}';
      GRANT pg_monitor TO canchas_monitor;
      CREATE DATABASE canchas OWNER canchas_migrador;
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname canchas <<-EOSQL
      REVOKE ALL ON DATABASE canchas FROM PUBLIC;
      GRANT CONNECT ON DATABASE canchas TO canchas_app, canchas_monitor;
      GRANT USAGE ON SCHEMA public TO canchas_app, canchas_monitor;
      -- Lo que cree el migrador (tablas) queda con SELECT/INSERT/UPDATE para la app, sin DDL ni superusuario
      ALTER DEFAULT PRIVILEGES FOR ROLE canchas_migrador IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE ON TABLES TO canchas_app;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-hl
  labels: {app: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-hl
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, tier: datos}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            - name: MIGRADOR_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: MIGRADOR_PASSWORD}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: APP_PASSWORD}}
            - name: MONITOR_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: MONITOR_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
