# Igual que local-path (el que trae k3s) pero con reclaimPolicy Retain: si se borra el PVC,
# el volumen y sus datos NO se eliminan. (local-path por defecto usa Delete.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
